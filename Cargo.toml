[package]
name = "matrix-mcp-server-r2"
version = "0.1.1"
edition = "2021"
authors = ["l0r3zz"]
description = "Rust implementation of Matrix MCP Server - drop-in replacement for TypeScript version"
license = "MIT"
repository = "https://github.com/l0r3zz/matrix-mcp-server-r2"
# Compiling pin remains 1.88 until the 0.19 client migration
# (see .specify/specs/002-e2ee-cross-signing/tasks.md). E2EE target is Rust >= 1.99.
rust-version = "1.88"

[dependencies]
# Async runtime
tokio = { version = "1.43", features = ["full", "rt-multi-thread", "signal"] }

# HTTP framework
axum = { version = "0.8", features = ["macros"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }

# MCP SDK
rmcp = { version = "1.2", default-features = false, features = ["server", "macros", "transport-streamable-http-server"] }

# Matrix SDK. Compiling pin is 0.10 so this tree still builds.
# Agreed E2EE target (2026-10-23): matrix-sdk 0.19 (crate MSRV 1.96; project pins Rust 1.99),
# with e2e-encryption and bundled-sqlite. Do not ship E2EE on 0.10
# (CVE-2026-45056 is fixed in matrix-sdk-crypto 0.16.1, which 0.19 includes).
# rmcp stays at 1.2 for the E2EE feature. The version flip is the first
# implementation task in .specify/specs/002-e2ee-cross-signing/tasks.md.
matrix-sdk = { version = "0.10", default-features = false, features = ["rustls-tls"] }
ruma = { version = "0.12", features = ["client-api-c", "compat"] }

# Serialization & Schema
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "1"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging/tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Environment/config
dotenvy = "0.15"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Async utilities
async-trait = "0.1"

# URL parsing
url = "2.5"

[dev-dependencies]
tokio-test = "0.4"
wiremock = "0.6"
serial_test = "3.2"
regex = "1"

[features]
default = []
e2ee = ["matrix-sdk/e2e-encryption"]

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1

[profile.dev]
opt-level = 0
debug = true
