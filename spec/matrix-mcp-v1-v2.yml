spec:
  name: matrix-mcp-server-r2
  version: "2.0.0"
  summary: >
    Unified Matrix MCP gateway for the Agent-Matrix fleet. Exposes 20 operational
    Matrix tools that transparently support Cross-Signed E2EE by default (with
    automatic pre-flight /keys/query fallback to unencrypted rooms when an
    invitee lacks cross-signed E2EE keys), plus 2 E2EE management/diagnostic
    tools (bootstrap-e2ee and get-encryption-status).

  goals:
    - Provide seamless E2EE-by-default on the existing 20 MCP tool names so external clients require zero tool-name changes.
    - Default create-room and send-direct-message to encryptionMode="auto" (pre-flight /keys/query enables E2EE when invitees have cross-signed keys, and falls back to an unencrypted room when an invitee lacks E2EE keys).
    - Handle encrypted and unencrypted rooms transparently in send-message, get-room-messages, get-messages-by-date, and identify-active-users.
    - Automatically bootstrap device keys and cross-signing at server startup when E2EE_ENABLED=true, while exposing bootstrap-e2ee and get-encryption-status for explicit operator control.
    - Serve as the single Matrix client and SQLite crypto store owner per agent container (supporting Stage 2 absorption of matrix-bot into src/bot/).

  non_goals:
    - Splitting tools into duplicate -r2 variants or refusing encrypted rooms with EncryptedRoomError.
    - Interactive emoji or QR verification UX. Headless cross-signing via a recovery key is in scope.
    - Trust-on-first-use (TOFU) inside encrypted rooms. Room keys are never shared with devices that are not cross-signed.

  operational_requirements:
    - One persistent Matrix device identity (.device-id aligned with /_matrix/client/v3/account/whoami) and one SQLite crypto store per agent instance.
    - Device identity and crypto store MUST survive restart and host migration.
    - Crypto store MUST be isolated per agent instance and locked against concurrent multi-process access.
    - Logs and MCP tool responses MUST NOT contain plaintext key material, passwords, or recovery secrets.
    - Inside encrypted rooms, trust policy is strictly cross-signed (Matrix spec v1.18 / MSC4153). TOFU is rejected.
    - Backup secret resolution supports secret-manager references, env-var names, and MATRIX_RECOVERY_KEY_FILE in strict precedence order.
    - Initial Secret Storage creation may read an account password from MATRIX_UIAA_PASSWORD_FILE (0600 file) for UIAA on /keys/device_signing/upload only. It is never a tool input. If the homeserver requires UIAA and that file is unset or unreadable, bootstrap returns UiaaRequiredError and does not create an identity.

concepts:
  RoomId:
    description: Matrix room ID, e.g. "!abc123:example.org".
    type: string

  UserId:
    description: Matrix user ID, e.g. "@user:example.org".
    type: string

  EncryptionMode:
    description: >
      How room creation encryption should be handled in create-room and send-direct-message.
      "auto" = Pre-flight query /_matrix/client/v3/keys/query for invitees; create an encrypted
               room if all invitees have cross-signed E2EE keys (or no invitees are specified),
               or automatically fall back to an unencrypted room if an invitee lacks E2EE keys
               (network/federation errors fail closed).
      "e2ee" = Require end-to-end encryption; fail if any invitee lacks cross-signed E2EE keys.
      "none" = Explicitly create an unencrypted room.
    type: string
    enum: ["auto", "e2ee", "none"]
    default: "auto"

  TrustPolicy:
    description: >
      Fixed trust policy inside encrypted rooms. Room keys and other encrypted to-device
      secrets go only to cross-signed devices (Matrix spec v1.18).
      "tofu" is rejected.
    type: string
    enum: ["cross-signed"]
    default: "cross-signed"

  DeviceId:
    description: Stable Matrix device identifier bound to the session and stored in $CRYPTO_STORE_PATH/.device-id.
    type: string

  CryptoStoreState:
    description: Health/status of the local Olm/Megolm SQLite crypto store.
    type: string
    enum: ["missing", "ready", "corrupt", "unreadable"]

  KeyBackupRestoreState:
    description: Progress of historical room-key backup restoration.
    type: string
    enum: ["not_started", "running", "done", "failed"]

  DecryptionState:
    description: Per-message decryption status when reading room history.
    type: string
    enum: ["not_encrypted", "decrypted", "missing_key", "failed"]

  TrustPolicyNotSatisfiedError:
    description: >
      Returned when caller passes a trustPolicy other than "cross-signed", or requests
      encryptionMode="e2ee" for an invitee without cross-signed E2EE keys, or when this
      device is not cross-signed.

  SecretResolutionError:
    description: >
      Returned when a configured recovery secret source cannot be resolved.

  IdentityExistsError:
    description: >
      Returned during bootstrap when the account already has a cross-signing identity
      on the homeserver and no recovery secret was available to unlock it.

  UiaaRequiredError:
    description: >
      Returned during bootstrap when the homeserver requires User-Interactive Auth to
      create a cross-signing identity and MATRIX_UIAA_PASSWORD_FILE is unset or unreadable.

  CryptoNotBootstrappedError:
    description: >
      Returned when an encrypted operation is requested before E2EE bootstrap has completed.

  KeyStoreUnavailableError:
    description: >
      Returned when the local SQLite crypto store cannot be opened or is locked by another process.

apis:
  unified:
    description: >
      Unified 20+2 MCP tool surface. All 20 operational tools transparently handle both
      encrypted and unencrypted rooms. Key E2EE-enhanced and E2EE-specific tools are
      specified below.

    tools:

      create-room:
        name: create-room
        summary: Create a new Matrix room (encrypted by default with automatic pre-flight capability fallback).
        request:
          type: object
          required: ["roomName"]
          properties:
            roomName:
              type: string
            isPrivate:
              type: boolean
              default: false
            topic:
              type: string
              nullable: true
            inviteUsers:
              type: array
              items: { $ref: "#/concepts/UserId" }
            roomAlias:
              type: string
              nullable: true
            encryptionMode:
              $ref: "#/concepts/EncryptionMode"
        response:
          type: object
          description: Formatted text summary including room ID, privacy, invited users, and encryption state (plus fallback reason if downgraded in "auto" mode).
          properties:
            roomId: { $ref: "#/concepts/RoomId" }
            encrypted: { type: boolean }
            fallbackReason: { type: string, nullable: true }
        error_behavior:
          - In "auto" mode, if /keys/query fails due to network or federation error, fail closed (do not downgrade).
          - In "e2ee" mode, if any invitee lacks cross-signed E2EE keys, return TrustPolicyNotSatisfiedError.
          - If encryption is requested and bootstrap is incomplete, return CryptoNotBootstrappedError.

      send-direct-message:
        name: send-direct-message
        summary: Send a direct message to a user, creating a new DM room (with encryptionMode="auto" by default) if none exists.
        request:
          type: object
          required: ["targetUserId", "message"]
          properties:
            targetUserId: { $ref: "#/concepts/UserId" }
            message: { type: string }
            encryptionMode:
              $ref: "#/concepts/EncryptionMode"
        response:
          type: object
          properties:
            roomId: { $ref: "#/concepts/RoomId" }
            eventId: { type: string }
            encrypted: { type: boolean }
            created: { type: boolean }

      send-message:
        name: send-message
        summary: Send a message to a Matrix room (automatically encrypts via Megolm for cross-signed devices if the room is encrypted, or sends plaintext if unencrypted).
        request:
          type: object
          required: ["roomId", "message"]
          properties:
            roomId: { $ref: "#/concepts/RoomId" }
            message: { type: string }
            messageType:
              type: string
              enum: ["text", "html", "emote"]
              default: "text"
            replyToEventId:
              type: string
              nullable: true
        response:
          type: object
          properties:
            eventId: { type: string }
            encrypted: { type: boolean }
        error_behavior:
          - If the room is encrypted and E2EE bootstrap is incomplete, return CryptoNotBootstrappedError.
          - Outbound room keys are withheld (m.unverified) from any member device that is not cross-signed.

      get-room-messages:
        name: get-room-messages
        summary: Retrieve recent messages from a Matrix room (automatically decrypting encrypted events when keys are present and marking undecryptable events).
        request:
          type: object
          required: ["roomId"]
          properties:
            roomId: { $ref: "#/concepts/RoomId" }
            limit:
              type: integer
              default: 20
        response:
          type: object
          properties:
            messages:
              type: array
              items:
                type: object
                properties:
                  eventId: { type: string }
                  sender: { $ref: "#/concepts/UserId" }
                  body: { type: string }
                  encrypted: { type: boolean }
                  decryptionState: { $ref: "#/concepts/DecryptionState" }
                  timestamp: { type: string, format: date-time }
        error_behavior:
          - If an encrypted event is missing its Megolm key, do not panic; include the message with decryptionState="missing_key" and body marker "[Encrypted message - unable to decrypt (missing_key)]".

      bootstrap-e2ee:
        name: bootstrap-e2ee
        summary: >
          Initialize or verify E2EE state for this MCP device, including device key upload,
          Secret Storage unlock, and cross-signing verification. Also runs automatically at
          server startup when E2EE_ENABLED=true.
        request:
          type: object
          properties:
            forceRecreate:
              type: boolean
              default: false
              description: >
                If true, clear and recreate local crypto store and rotate device keys.
            trustPolicy:
              $ref: "#/concepts/TrustPolicy"
            backupPassphraseEnvVar:
              type: string
              nullable: true
              description: >
                Name of env var that holds the recovery secret. Pass variable name only, never raw secret value.
            backupPassphraseRef:
              type: string
              nullable: true
              description: >
                Optional reference to a secret manager entry for encrypted backup/restore. Never pass raw secrets.
        response:
          type: object
          properties:
            deviceId:
              $ref: "#/concepts/DeviceId"
            identityKey:
              type: string
            crossSigned:
              type: boolean
            olmEnabled:
              type: boolean
            cryptoStoreState:
              $ref: "#/concepts/CryptoStoreState"
            uploadedOneTimeKeys:
              type: integer
            backupConfigured:
              type: boolean
            resolvedBackupSource:
              type: string
              enum: ["none", "secret_manager_ref", "env_var", "recovery_key_file"]
            keyBackupRestore:
              $ref: "#/concepts/KeyBackupRestoreState"
            trustPolicy:
              $ref: "#/concepts/TrustPolicy"
            notes:
              type: string
        error_behavior:
          - If local crypto store cannot be opened, return KeyStoreUnavailableError.
          - If trustPolicy is anything other than "cross-signed", return TrustPolicyNotSatisfiedError.
          - If an identity already exists on the homeserver and no recovery secret resolves, return IdentityExistsError.
          - If creating an identity requires UIAA and MATRIX_UIAA_PASSWORD_FILE is unset or unreadable, return UiaaRequiredError.

      get-encryption-status:
        name: get-encryption-status
        summary: Report room and device E2EE readiness, cross-signing state, and crypto store health.
        request:
          type: object
          properties:
            roomId:
              $ref: "#/concepts/RoomId"
              nullable: true
        response:
          type: object
          properties:
            roomId:
              $ref: "#/concepts/RoomId"
              nullable: true
            roomEncrypted:
              type: boolean
              nullable: true
            bootstrapped:
              type: boolean
            crossSigned:
              type: boolean
            deviceId:
              $ref: "#/concepts/DeviceId"
            cryptoStoreState:
              $ref: "#/concepts/CryptoStoreState"
            canDecryptNow:
              type: boolean
            trustPolicy:
              $ref: "#/concepts/TrustPolicy"
            backupSourceConfigured:
              type: string
              enum: ["none", "secret_manager_ref", "env_var", "recovery_key_file"]
            keyBackupRestore:
              $ref: "#/concepts/KeyBackupRestoreState"
            notes:
              type: string

tests:
  unencrypted_and_fallback:
    description: >
      - Unencrypted rooms (e.g., Fleet HQ Clean) continue to work with send-message and get-room-messages.
      - create-room with encryptionMode="auto" falls back to an unencrypted room when /keys/query shows an invitee has no cross-signed E2EE keys, and fails closed on network errors.

  cross_signed_e2ee:
    description: >
      - Startup auto-bootstrap unlocks Secret Storage (or creates cross-signing on a fresh account and writes a 0600 recovery-key file).
      - create-room with encryptionMode="auto" creates an encrypted room when invitees are cross-signed (or when no invitees are specified).
      - send-message and get-room-messages transparently encrypt and decrypt in encrypted rooms.
      - After MCP restart or host migration with restored crypto store, previously encrypted room messages remain decryptable.
      - A device that is not cross-signed does not receive room keys (m.unverified).
      - Acceptance homeserver is Continuwuity; first gate is an encrypted group room round-trip with Element.
